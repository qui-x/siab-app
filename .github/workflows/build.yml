name: Build EXE, MSI, AppImage e APK
on: [workflow_dispatch, push]
jobs:
  validate-unit:
    name: Integridade, sintaxe e armazenamento
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qui-x/acidobase
          ref: acidosebases1.0.0
          path: siab-source
      - id: version
        run: echo "sha=$(git -C siab-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: siab-source/package-lock.json
      - name: Instalar dependências
        working-directory: siab-source
        run: npm ci
      - name: Checar SHA, sintaxe e integridade do SIAB
        working-directory: siab-source
        run: |
          sha256sum --check SHA256SUMS.txt
          sha512sum --check SHA512SUMS.txt
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
      - name: Testar persistência e compactação de dados
        working-directory: siab-source
        run: node --test tests/persistencia-compacta.test.cjs
      - name: Reconstruir documentação e standalone
        working-directory: siab-source
        run: npm run build

  validate-browser:
    name: Funcionalidades / ${{ matrix.browser }}
    needs: validate-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qui-x/acidobase
          ref: ${{ needs.validate-unit.outputs.source_sha }}
          path: siab-source
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: siab-source/package-lock.json
      - name: Instalar Playwright e navegador
        working-directory: siab-source
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Iniciar servidor de testes
        working-directory: siab-source
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/siab-ci-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/siab-ci-http.log
          exit 1
      - name: Bancada, previsão, medição, layout e IndexedDB
        working-directory: siab-source
        env:
          SIAB_BROWSER: ${{ matrix.browser }}
          SIAB_TEST_URL: http://127.0.0.1:8765
        run: node --test tests/ver-expand.test.cjs tests/ver-layout.test.cjs tests/prever-gotejar.test.cjs tests/persistencia-browser.test.cjs tests/instalacao-interface.test.cjs

  windows:
    needs: [validate-unit, validate-browser]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qui-x/acidobase
          ref: ${{ needs.validate-unit.outputs.source_sha }}
          path: siab-source
      - name: Atualizar www com a revisão oficial aprovada
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          for item in index.html a11y.js sw.js manifest.webmanifest favicon-dark.svg favicon-light.svg assets css js vendor docs; do
            test -e "siab-source/$item"
            cp -a "siab-source/$item" www/
          done
          cmp siab-source/sw.js www/sw.js
          test -s www/js/core/persistencia.js
          test -s www/js/data/manual.js
          echo "Build a partir do commit $(git -C siab-source rev-parse HEAD)" > www/SOURCE-COMMIT.txt
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: SIAB-windows
          path: |
            dist/SIAB-portatil.exe
            dist/SIAB-instalador.exe
            dist/SIAB-instalador.msi
  linux:
    needs: [validate-unit, validate-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qui-x/acidobase
          ref: ${{ needs.validate-unit.outputs.source_sha }}
          path: siab-source
      - name: Atualizar www com a revisão oficial aprovada
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          for item in index.html a11y.js sw.js manifest.webmanifest favicon-dark.svg favicon-light.svg assets css js vendor docs; do
            test -e "siab-source/$item"
            cp -a "siab-source/$item" www/
          done
          cmp siab-source/sw.js www/sw.js
          test -s www/js/core/persistencia.js
          test -s www/js/data/manual.js
          echo "Build a partir do commit $(git -C siab-source rev-parse HEAD)" > www/SOURCE-COMMIT.txt
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with: { name: SIAB-linux, path: dist/SIAB-linux.AppImage }
  apk:
    needs: [validate-unit, validate-browser]
    runs-on: ubuntu-latest
    env:
      SIAB_KS_B64: ${{ secrets.SIAB_KEYSTORE_B64 }}
      SIAB_KS_PASS: ${{ secrets.SIAB_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qui-x/acidobase
          ref: ${{ needs.validate-unit.outputs.source_sha }}
          path: siab-source
      - name: Atualizar www com a revisão oficial aprovada
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          for item in index.html a11y.js sw.js manifest.webmanifest favicon-dark.svg favicon-light.svg assets css js vendor docs; do
            test -e "siab-source/$item"
            cp -a "siab-source/$item" www/
          done
          cmp siab-source/sw.js www/sw.js
          test -s www/js/core/persistencia.js
          test -s www/js/data/manual.js
          echo "Build a partir do commit $(git -C siab-source rev-parse HEAD)" > www/SOURCE-COMMIT.txt
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow
      - name: Aplicar ícone e abertura do SIAB
        run: python tools/gen_android_icons.py android/app/src/main/res icon.png
      - name: Barras do sistema na cor do SIAB
        run: |
          cat > /tmp/patch_styles.py <<'FIM_ARQUIVO'
          import re,sys
          p=sys.argv[1]; s=open(p,encoding='utf-8').read()
          marker='<item name="android:background">@null</item>'
          add=marker+'\n        <item name="android:statusBarColor">#0c1520</item>\n        <item name="android:navigationBarColor">#0c1520</item>'
          assert s.count(marker)==1, 'styles.xml inesperado'
          open(p,'w',encoding='utf-8').write(s.replace(marker,add))
          print('barras do sistema ajustadas')
          FIM_ARQUIVO
          python /tmp/patch_styles.py android/app/src/main/res/values/styles.xml
      - name: Habilitar impressão e abertura de links no Android
        run: |
          D=android/app/src/main/java/io/github/quix/siab
          test -d "$D" || { echo "Pasta $D não existe"; exit 1; }
          cat > $D/PrintPlugin.java <<'FIM_ARQUIVO'
          package io.github.quix.siab;

          import android.content.Context;
          import android.os.Handler;
          import android.os.Looper;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintJob;
          import android.print.PrintManager;
          import android.webkit.WebView;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Abre a tela de impressão do Android (imprimir ou "Salvar como PDF") para a página atual. */
          @CapacitorPlugin(name = "SIABPrint")
          public class PrintPlugin extends Plugin {

              @PluginMethod
              public void print(final PluginCall call) {
                  final String titulo = call.getString("title", "SIAB");
                  getActivity().runOnUiThread(() -> {
                      try {
                          WebView webView = getBridge().getWebView();
                          PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                          PrintDocumentAdapter adaptador = webView.createPrintDocumentAdapter(titulo);
                          final PrintJob job = pm.print(titulo, adaptador, null);
                          final Handler handler = new Handler(Looper.getMainLooper());
                          // Resolve quando o trabalho termina, é cancelado ou falha.
                          handler.postDelayed(new Runnable() {
                              @Override
                              public void run() {
                                  if (job.isCompleted() || job.isCancelled() || job.isFailed()) {
                                      call.resolve();
                                  } else {
                                      handler.postDelayed(this, 500);
                                  }
                              }
                          }, 500);
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      }
                  });
              }
          }
          FIM_ARQUIVO
          cat > $D/LinkPlugin.java <<'FIM_ARQUIVO'
          package io.github.quix.siab;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Guarda o link siab:// que abriu o aplicativo para o SIAB ler quando estiver pronto. */
          @CapacitorPlugin(name = "SIABLink")
          public class LinkPlugin extends Plugin {
              static volatile String pendente = null;

              @PluginMethod
              public void getLaunchLink(PluginCall call) {
                  JSObject resposta = new JSObject();
                  String url = pendente;
                  pendente = null;
                  if (url != null) resposta.put("url", url);
                  call.resolve(resposta);
              }
          }
          FIM_ARQUIVO
          cat > $D/MainActivity.java <<'FIM_ARQUIVO'
          package io.github.quix.siab;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PrintPlugin.class);
                  registerPlugin(LinkPlugin.class);
                  super.onCreate(savedInstanceState);
                  guardarLink(getIntent());
              }

              // Aplicativo já aberto recebe um novo link siab://
              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  guardarLink(intent);
                  entregarLink();
              }

              private void guardarLink(Intent intent) {
                  if (intent == null) return;
                  Uri dados = intent.getData();
                  if (dados == null) return;
                  String esquema = dados.getScheme();
                  boolean linkSiab = "siab".equals(esquema);
                  boolean linkSite = "https".equals(esquema) && "qui-x.github.io".equals(dados.getHost());
                  if (linkSiab || linkSite) {
                      LinkPlugin.pendente = dados.toString();
                  }
              }

              private void entregarLink() {
                  final String url = LinkPlugin.pendente;
                  if (url == null || getBridge() == null) return;
                  final WebView web = getBridge().getWebView();
                  web.post(() -> web.evaluateJavascript(
                      "(function(u){if(window.SIABAbrirLink){window.SIABAbrirLink(u);return true;}return false;})("
                          + JSONObject.quote(url) + ")",
                      valor -> { if ("true".equals(valor)) LinkPlugin.pendente = null; }));
              }
          }
          FIM_ARQUIVO
          cat > /tmp/patch_manifest.py <<'FIM_ARQUIVO'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          filtros = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="siab" android:host="atividade" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="qui-x.github.io" android:pathPrefix="/acidobase" />
                      </intent-filter>
          """
          fim = "        </activity>"
          assert s.count(fim) == 1, "AndroidManifest.xml inesperado"
          open(p, "w", encoding="utf-8").write(s.replace(fim, filtros + fim))
          print("filtros siab:// e https adicionados")
          FIM_ARQUIVO
          python /tmp/patch_manifest.py android/app/src/main/AndroidManifest.xml
          grep -c 'qui-x.github.io' android/app/src/main/AndroidManifest.xml
      - run: npm run build:apk
      - name: Assinar com a chave fixa do SIAB
        if: env.SIAB_KS_B64 != ''
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$SIAB_KS_B64" | base64 -d > /tmp/siab.keystore
          "$BT/apksigner" sign --ks /tmp/siab.keystore --ks-type PKCS12 --ks-key-alias siab --ks-pass env:SIAB_KS_PASS --key-pass env:SIAB_KS_PASS --out /tmp/siab-signed.apk "$APK"
          mv /tmp/siab-signed.apk "$APK"
          rm -f /tmp/siab.keystore
      - name: Impressão digital do certificado do APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with: { name: SIAB-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
