name: Build EXE, MSI, AppImage e APK
on: [workflow_dispatch, push]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: SIAB-windows
          path: |
            dist/SIAB-portatil.exe
            dist/SIAB-instalador.exe
            dist/SIAB-instalador.msi
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with: { name: SIAB-linux, path: dist/SIAB-linux.AppImage }
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow
      - name: Aplicar ícone e abertura do SIAB
        run: python tools/gen_android_icons.py android/app/src/main/res icon.png
      - name: Habilitar impressão no Android
        run: |
          cp tools/android/PrintPlugin.java tools/android/MainActivity.java android/app/src/main/java/io/github/quix/siab/
          cp tools/android/print-shim.js www/print-shim.js
          sed -i 's#</body>#<script src="print-shim.js"></script></body>#' www/index.html
          grep -c 'print-shim.js' www/index.html
      - run: npm run build:apk
      - uses: actions/upload-artifact@v4
        with: { name: SIAB-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
