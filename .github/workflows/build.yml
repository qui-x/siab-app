name: Build EXE e APK
on: [workflow_dispatch, push]
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with: { name: SIAB-portatil-exe, path: dist/SIAB-portatil.exe }
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow
      - name: Aplicar ícone e abertura do SIAB
        run: python tools/gen_android_icons.py android/app/src/main/res icon.png
      - run: npm run build:apk
      - uses: actions/upload-artifact@v4
        with: { name: SIAB-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
